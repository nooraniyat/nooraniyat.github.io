<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow" />

  <!-- Primary meta -->
  <title>Nooraniyat — نمایش متن و صدا</title>
  <meta name="description" content="نمایش متن، صدا و تقویم شخصی" />
  <meta name="keywords" content="نورانیات, Nooraniyat, dashboard, text display" />
  <meta name="author" content="nooraniyat" />
  <meta name="theme-color" content="#c8b97a" />
  <link rel="canonical" href="https://nooraniyat.github.io/" />

  <!-- Open Graph (Facebook, WhatsApp, Telegram, LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nooraniyat.github.io/" />
  <meta property="og:site_name" content="Nooraniyat" />
  <meta property="og:title" content="Nooraniyat — نمایش متن و صدا" />
  <meta property="og:description" content="نمایش متن، صدا و تقویم شخصی" />
  <meta property="og:image" content="https://nooraniyat.github.io/assets/media/background/arbaeen.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="fa_IR" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://nooraniyat.github.io/" />
  <meta name="twitter:title" content="Nooraniyat — نمایش متن و صدا" />
  <meta name="twitter:description" content="نمایش متن، صدا و تقویم شخصی" />
  <meta name="twitter:image" content="https://nooraniyat.github.io/assets/media/background/arbaeen.jpg" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="manifest" href="site.webmanifest" />

  <link rel="stylesheet" href="assets/style/style.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" />
  <script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.min.js"></script>
</head>

<body>
  <!-- Full-page event background (behind everything) -->
  <div id="background-layer">
    <div id="bg-blur"></div>
    <div id="bg-sharp"></div>
  </div>

  <!-- Full-page webcam (behind decorative frame) -->
  <div id="webcam-view">
    <video id="webcam-feed" autoplay playsinline muted></video>
  </div>

  <div id="container">

    <!-- Main screen -->
    <div id="screen">

      <!-- View title -->
      <h2 id="quotation-name"></h2>

      <!-- Main content frame (decorative border) -->
      <div id="quotation-content">

        <!-- Quotation slides (quotation mode) -->
        <div id="quotation-slides-container"></div>

        <!-- Book reader (book mode) -->
        <div id="book-view"></div>

        <!-- Tile overlays (inside frame, so decorative border stays visible) -->
        <div id="quotation-list"></div>
        <div id="book-sidebar"></div>

      </div>

      <!-- Controls / FAB bar -->
      <div id="controls">

        <div id="controls-right">
          <button id="btn-home-link" title="خانه">🏠</button>
          <button id="btn-book" title="قرآن">📖</button>
          <button id="home-btn" title="فهرست دعا">🤲</button>
          <button id="btn-background" title="پس‌زمینه">🖼️</button>
          <button id="btn-camera" title="دوربین">🎦</button>
          <button id="contrast-btn" title="روشنایی">🌓</button>
          <button id="btn-music" title="موسیقی">🎵</button>
          <button id="btn-fullscreen" title="تمام‌صفحه">⛶</button>
        </div>

        <div id="controls-center">
          <span id="nav-group">
            <button id="prev-slide" title="پیشین">▶</button>
            <input type="range" id="slide-slider" min="1" max="1" value="1" step="1" />
            <span id="slide-counter">۰ / ۰</span>
            <button id="next-slide" title="پسین">◀</button>
          </span>
          <button id="persian-minus-btn" title="کوچک‌تر">➖&#xFE0E;</button>
          <button id="persian-plus-btn" title="بزرگ‌تر">➕&#xFE0E;</button>
          <button id="audio-play-btn" title="پخش تلاوت" class="hidden">▷</button>
        </div>

        <div id="controls-left">
          <div id="cal-group">
            <button id="btn-calendar" title="تقویم و اذان">📅</button>
            <div id="calendar-call-time-block">
              <span id="city-display" title="کلیک برای تغییر شهر">—</span>
              <div id="city-edit-row" style="display:none">
                <input id="city-input" type="text" placeholder="شهر, کشور (مثلاً Tehran, Iran)" />
                <button id="city-save-btn">ذخیره</button>
              </div>
              <span class="cal-sep">/</span>
              <span id="cal-hijri">—</span>
              <span class="cal-sep">/</span>
              <span id="cal-persian">—</span>
              <span class="cal-sep">/</span>
              <span id="cal-gregorian">—</span>
              <span class="cal-sep">/</span>
              <span id="call-times"></span>
              <span class="cal-sep">/</span>
            </div>
          </div>
          <span id="current-time">—</span>
        </div>

      </div>

    </div>
  </div>

  <script src="main.js"></script>

  <img
    src="//www.clustrmaps.com/map_v2.png?d=pB2RtEP2qTQXrIIXGr9x3a60TY4Zs8CTY25OcIsfUYU&cl=ffffff"
    width="1" height="1" style="opacity:0.01;" alt=""
  />
</body>
</html>
